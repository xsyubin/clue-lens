name: Clue Lens CI Delivery Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 质量、安全与构建全栈门禁
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 初始化 Node.js 运行时
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: 安装项目依赖
        run: npm install --legacy-peer-deps

      - name: 初始化数据库与运行时配置
        run: npm run setup

      - name: TypeScript 静态类型无死角检查
        run: npm run typecheck

      - name: ESLint 代码规范与代码健康检查
        run: npm run lint

      - name: 专卖监管业务单元与 RBAC 边界防卫测试
        run: npm test

      - name: MCP 协议契约与数据安全探查测试
        run: npm run test:mcp

      - name: 全量确定性前置审查 (Deterministic Review)
        run: npm run review

      - name: Next.js 生产环境构建打包
        run: npm run build
